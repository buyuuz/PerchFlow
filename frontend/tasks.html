<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
<link rel="stylesheet" href="/assets/pf-dialog.css">
</head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary-container/30">
<!-- TopNavBar (与 processes.html 一致) -->

<!-- Left: Logo & Nav Links -->
<div class="flex items-center gap-8 h-full">
<div class="pf-header-brand text-primary">
<img alt="PerchFlow" class="pf-brand-icon" src="/assets/logo.png?v=brand2" width="28" height="28"/>
<span class="pf-brand-name">Perch<span class="text-on-surface">Flow</span></span>
            </div>
<div class="hidden md:flex h-full gap-6">
<!-- Inactive Nav Item (Processes) -->
<a class="pf-main-nav-link" data-i18n="nav.processes" href="/processes">
                    进程

<!-- Active Nav Item (Tasks) -->

                </a>

<a class="pf-main-nav-link" href="/docker">Docker</a>
</div>
</div>
<!-- Right: Actions & Status -->
<div class="pf-process-nav-right pf-top-actions">
<div class="pf-top-status" role="status" aria-label="Connected">
<span class="pf-top-status-dot" aria-hidden="true"></span>
<span>Connected</span>
</div>
<button class="pf-process-add pf-top-add" type="button" onclick="openTaskModal()">
<span class="pf-top-add-icon" aria-hidden="true"></span>
                <span class="pf-top-add-text" data-i18n="button.add_task">添加任务</span>
            </button>
<div class="pf-lang-picker" data-pf-language-picker>
  <!-- Keep native select as keyboard/JS-off fallback and existing i18n event target. -->
  <select class="pf-top-lang" data-lang-select aria-label="语言 / Language" onchange="setLang(this.value)">
    <option value="zh">CN 中文</option>
    <option value="en">EN English</option>
  </select>
  <button type="button" class="pf-lang-trigger" data-lang-trigger aria-label="Language / 语言" aria-haspopup="listbox" aria-expanded="false" aria-controls="pf-language-menu" hidden>
    <span class="pf-lang-code" data-lang-code>CN</span>
    <span class="pf-lang-label" data-lang-current>中文</span>
    <span class="material-symbols-outlined pf-lang-chevron" aria-hidden="true">keyboard_arrow_down</span>
  </button>
  <div class="pf-lang-menu" id="pf-language-menu" data-lang-menu role="listbox" aria-label="Language / 语言" hidden>
    <button type="button" class="pf-lang-option" role="option" data-lang-value="zh" data-lang-code="CN" data-lang-label="中文" aria-selected="true" tabindex="-1"><span class="pf-lang-code">CN</span><span class="pf-lang-option-label">中文</span><span class="material-symbols-outlined pf-lang-check" aria-hidden="true">check</span></button>
    <button type="button" class="pf-lang-option" role="option" data-lang-value="en" data-lang-code="EN" data-lang-label="English" aria-selected="false" tabindex="-1"><span class="pf-lang-code">EN</span><span class="pf-lang-option-label">English</span><span class="material-symbols-outlined pf-lang-check" aria-hidden="true">check</span></button>
  </div>
</div>
</div>
</nav>
<!-- Main Content -->
<main class="pt-[80px] px-4 md:px-container-padding pb-20 md:pb-10 max-w-[1600px] mx-auto">
<!-- Header -->
<div class="flex justify-between items-center mb-6">
<div>
<h1 class="pf-management-page-title text-on-surface" data-i18n="page.tasks_title">定时任务</h1>
<p class="pf-management-page-subtitle text-on-surface-variant" data-i18n="page.tasks_subtitle">管理 cron 调度的任务</p>
</div>
<div class="flex gap-2 items-center">
<button id="task-bind-existing" type="button" class="pf-taskdetail-btn" style="border:1px solid #2c5a6b;border-radius:8px;padding:7px 12px;font-size:12px;color:#31d8ed">关联已有脚本</button>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input id="task-search" class="bg-surface-container-high border border-white/10 rounded pl-9 pr-3 py-1.5 text-sm font-body-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 text-on-surface placeholder:text-on-surface-variant/50 w-32 md:w-64 transition-all" data-i18n-placeholder="search.tasks" placeholder="搜索任务..." type="search" autocomplete="off" aria-label="搜索任务"/>
</div>
</div>
</div>
<div class="pf-task-count" id="task-count" role="status">共 0 项 · 已启用 0 项</div>
<!-- Tasks use the same full-width management table surface as Processes. -->
<section class="pf-process-table-shell pf-task-table-shell" aria-label="定时任务列表">
  <div class="pf-process-table-scroll" tabindex="0" aria-label="可横向滚动的定时任务列表">
    <table class="pf-process-table pf-task-table" aria-label="定时任务管理列表">
      <colgroup>
        <col style="width:3.5%">
        <col style="width:18%">
        <col style="width:9%">
        <col style="width:14%">
        <col style="width:18%">
        <col style="width:14%">
        <col style="width:9%">
        <col style="width:14.5%">
      </colgroup>
      <thead>
        <tr>
          <th scope="col"><input type="checkbox" id="task-select-all" aria-label="选择所有显示的任务"></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-task-sort="name"><span data-task-label="name">任务名称</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-task-sort="enabled"><span data-task-label="enabled">状态</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-task-sort="schedule"><span data-task-label="schedule">Cron 表达式</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" data-task-label="command">启动命令</th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-task-sort="last_run"><span data-task-label="last_run">上次运行</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-task-sort="last_exit_code"><span data-task-label="last_exit_code">运行结果</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" data-task-label="actions">操作</th>
        </tr>
      </thead>
      <tbody id="task-rows"></tbody>
    </table>
  </div>
</section>
<div id="task-selection-toolbar" class="pf-selection-toolbar" hidden>
  <span id="task-selected-label" role="status"></span>
  <button type="button" id="task-clear-selection" class="pf-clear-selection">取消选择</button>
</div>
<p id="task-scroll-hint" class="pf-table-scroll-hint">左右滑动表格可查看更多列和操作</p>
<p id="task-feedback" class="pf-table-scroll-hint" role="alert" hidden></p>
<!-- Mobile Bottom Spacer -->
<div style="height: 80px;" class="block md:hidden w-full shrink-0"></div>
</main>
<!-- Add/Edit Task Modal -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden items-center justify-center p-4" id="task-modal">
<div class="glass-card w-full max-w-md rounded-xl p-6 flex flex-col gap-4">
<h2 class="font-headline-md text-headline-md text-on-surface" id="task-modal-title" data-i18n="modal.add_task">添加任务</h2>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.name">名称</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-name" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.command">命令</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-cmd" placeholder="/opt/scripts/backup.sh" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.args">参数（支持引号包裹空格）</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-args" placeholder="--full" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">工作目录（可选）</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-cwd" placeholder="D:\\Projects\\Daily_Check" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">最长运行秒数（0 = 不限制）</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-timeout" type="number" min="0" value="3600"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.cron">Cron 表达式</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-schedule" placeholder="0 0 0 * * *" type="text"/>
</div>
<div class="flex items-center gap-2">
<input id="task-enabled" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.enabled" for="task-enabled">启用</label>
</div>
<p class="font-body-sm text-body-sm text-error hidden" id="task-err"></p>
<div class="flex justify-end gap-3">
<button class="px-4 py-2 rounded font-body-md text-body-md border border-primary text-primary hover:bg-primary/10" data-i18n="button.cancel" onclick="closeTaskModal()">取消</button>
<button class="px-6 py-2 rounded font-body-md text-body-md bg-primary text-on-primary hover:bg-primary-fixed" data-i18n="button.save" onclick="submitTaskModal()">保存</button>
</div>
</div>
</div>
<!-- Task history and bounded output viewer -->
<div id="task-history-modal" role="dialog" aria-modal="true" aria-labelledby="task-history-title" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="glass-card w-full max-w-3xl rounded-xl p-5 flex flex-col gap-3" style="max-height:85vh">
    <div class="flex items-center justify-between gap-3">
      <h2 id="task-history-title" class="font-headline-md text-headline-md text-on-surface">执行历史</h2>
      <button type="button" onclick="closeTaskHistory()" class="px-3 py-2 rounded border border-white/10" aria-label="关闭历史记录">关闭</button>
    </div>
    <div id="task-history-list" class="overflow-y-auto flex flex-col gap-2" style="min-height:90px;max-height:200px"></div>
    <label class="text-on-surface-variant text-sm" for="task-run-log">本次运行输出（末尾最多 128 KiB）</label>
    <pre id="task-run-log" class="overflow-auto rounded bg-black/30 border border-white/10 p-3 text-xs whitespace-pre-wrap break-all" style="min-height:120px;max-height:40vh">选择一条记录查看日志</pre>
  </div>
</div>
<!-- Mobile Bottom Nav -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex items-center bg-surface/60 backdrop-blur-xl border-t border-white/10 h-14 box-content pb-[env(safe-area-inset-bottom)] md:hidden">

<span class="material-symbols-outlined text-[20px]">monitoring</span>
<span class="text-[10px]" data-i18n="nav.processes_short">进程</span>
</a>

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
<span class="text-[10px]" data-i18n="nav.tasks_short">任务</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center text-on-surface-variant opacity-70 gap-0.5 py-1" href="/projects"><span class="material-symbols-outlined text-[20px]">folder</span><span class="text-[10px]" data-i18n="nav.projects_short">项目</span></a>
<a class="flex-1 flex flex-col items-center justify-center text-on-surface-variant opacity-70 gap-0.5 py-1" href="/docker"><span class="material-symbols-outlined text-[20px]">deployed_code</span><span class="text-[10px]">Docker</span></a>
</nav>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/pf-dialog.js"></script>
<script src="/assets/topbar-controls.js?v=top2"></script>
<script src="/assets/tasks.js"></script>
</body></html>
