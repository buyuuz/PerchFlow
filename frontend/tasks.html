<!DOCTYPE html>

<html class="dark" lang=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PerchFlow - Tasks</title>
<meta name="description" content="PerchFlow - Lightweight Windows process & service manager with built-in web UI. Written in Rust."/>
<meta property="og:title" content="PerchFlow - Process & Service Manager"/>
<meta property="og:description" content="Lightweight single-binary process manager for Windows, written in Rust."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://github.com/buyuuz/PerchFlow"/>
<meta property="og:image" content="/assets/logo.png?v=brand2"/>
<link href="/assets/fonts.css" rel="stylesheet"/>
<link href="/assets/tailwind.css" rel="stylesheet"/>
<link href="/assets/logo.ico?v=brand2" rel="icon" type="image/x-icon"/>
<link rel="icon" type="image/png" href="/assets/favicon-96x96.png?v=brand2" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=brand2" />
<link rel="shortcut icon" href="/assets/favicon.ico?v=brand2" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PerchFlow" />
<link rel="manifest" href="/assets/site.webmanifest?v=brand2" />
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary-container/30">
<!-- TopNavBar (与 processes.html 一致) -->
<nav class="fixed top-0 w-full z-50 h-14 bg-surface/60 backdrop-blur-[30px] border-b border-white/10 shadow-sm flex justify-between items-center px-4 md:px-container-padding">
<!-- Left: Logo & Nav Links -->
<div class="flex items-center gap-8 h-full">
<div class="font-headline-lg text-headline-lg font-bold text-primary flex items-center gap-2">
<img alt="PerchFlow" class="w-7 h-7 object-contain" src="/assets/logo.png?v=brand2"/>
                Perch<span class="text-on-surface">Flow</span>
            </div>
<div class="hidden md:flex h-full gap-6">
<!-- Inactive Nav Item (Processes) -->
<a class="h-full flex items-center text-on-surface-variant font-medium hover:bg-white/5 transition-colors px-2 rounded-t-sm mt-1 mb-1" data-i18n="nav.processes" href="/processes">
                    进程
                </a>
<!-- Active Nav Item (Tasks) -->
<a class="h-full flex items-center text-primary border-b-2 border-primary pb-1 font-bold" data-i18n="nav.tasks" href="/tasks">
                    定时任务
                </a>
</div>
</div>
<!-- Right: Actions & Status -->
<div class="flex items-center gap-4">
<div class="hidden md:flex items-center gap-2 bg-surface-container-high px-3 py-1.5 rounded-full border border-white/5">
<div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.5)] animate-pulse"></div>
<span class="font-mono-data text-mono-data text-on-surface-variant">Connected</span>
</div>
<button class="bg-primary hover:bg-primary-fixed-dim text-on-primary px-4 h-9 rounded font-body-md font-medium transition-all duration-150 active:scale-[0.98] flex items-center gap-1 shadow-[0_0_15px_rgba(68,216,241,0.2)]" onclick="openTaskModal()">
<span class="material-symbols-outlined text-[18px]">add</span>
                <span data-i18n="button.add_task">添加任务</span>
            </button>
<select class="bg-surface-container-high border border-white/10 rounded px-3 h-9 text-on-surface-variant font-body-md text-body-md cursor-pointer" onchange="setLang(this.value)" data-lang-select>
<option value="zh">🇨🇳 中文</option>
<option value="en">🇬🇧 English</option>
<option value="es">🇪🇸 Español</option>
<option value="ja">🇯🇵 日本語</option>
<option value="pt">🇧🇷 Português</option>
</select>
</div>
</nav>
<!-- Main Content -->
<main class="pt-[80px] px-4 md:px-container-padding pb-20 md:pb-10 max-w-[1600px] mx-auto">
<!-- Header -->
<div class="flex justify-between items-center mb-6">
<div>
<h1 class="font-headline-lg text-[12px] leading-[12px] text-on-surface mb-1" data-i18n="page.tasks_title">定时任务</h1>
<p class="font-body-md text-[10px] text-on-surface-variant" data-i18n="page.tasks_subtitle">管理 cron 调度的任务</p>
</div>
<div class="flex gap-2">
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input class="bg-surface-container-high border border-white/10 rounded pl-9 pr-3 py-1.5 text-sm font-body-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 text-on-surface placeholder:text-on-surface-variant/50 w-32 md:w-64 transition-all" data-i18n-placeholder="search.tasks" placeholder="搜索任务..." type="text"/>
</div>
</div>
</div>
<div class="font-mono-data text-mono-data text-on-surface-variant mb-4" id="task-count">
                Total: 0 Active: 0
            </div>
<!-- Task List -->
<div class="flex flex-col gap-unit">
<!-- List Header -->
<div class="hidden md:grid grid-cols-[auto_1.5fr_1fr_2fr_1fr_auto] gap-4 px-4 py-2 font-mono-label text-mono-label text-on-surface-variant border-b border-white/5 mb-2">
<div class="w-10">Status</div>
<div>Task Name</div>
<div>Cron Schedule</div>
<div>Command</div>
<div>Last Run</div>
<div class="w-24 text-right">Actions</div>
</div>
<div id="task-rows"></div>
</div>
<!-- Mobile Bottom Spacer -->
<div style="height: 80px;" class="block md:hidden w-full shrink-0"></div>
</main>
<!-- Add/Edit Task Modal -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden items-center justify-center p-4" id="task-modal">
<div class="glass-card w-full max-w-md rounded-xl p-6 flex flex-col gap-4">
<h2 class="font-headline-md text-headline-md text-on-surface" id="task-modal-title" data-i18n="modal.add_task">添加任务</h2>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.name">名称</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-name" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.command">命令</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-cmd" placeholder="/opt/scripts/backup.sh" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.args">参数 (空格分隔)</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-args" placeholder="--full" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.cron">Cron 表达式</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="task-schedule" placeholder="0 0 0 * * *" type="text"/>
</div>
<div class="flex items-center gap-2">
<input id="task-enabled" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.enabled" for="task-enabled">启用</label>
</div>
<p class="font-body-sm text-body-sm text-error hidden" id="task-err"></p>
<div class="flex justify-end gap-3">
<button class="px-4 py-2 rounded font-body-md text-body-md border border-primary text-primary hover:bg-primary/10" data-i18n="button.cancel" onclick="closeTaskModal()">取消</button>
<button class="px-6 py-2 rounded font-body-md text-body-md bg-primary text-on-primary hover:bg-primary-fixed" data-i18n="button.save" onclick="submitTaskModal()">保存</button>
</div>
</div>
</div>
<!-- Mobile Bottom Nav -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex items-center bg-surface/60 backdrop-blur-xl border-t border-white/10 h-14 box-content pb-[env(safe-area-inset-bottom)] md:hidden">
<a class="flex-1 flex flex-col items-center justify-center text-on-surface-variant opacity-70 gap-0.5 py-1" href="/processes">
<span class="material-symbols-outlined text-[20px]">monitoring</span>
<span class="text-[10px]" data-i18n="nav.processes_short">进程</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center text-primary gap-0.5 py-1" href="/tasks">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
<span class="text-[10px]" data-i18n="nav.tasks_short">任务</span>
</a>
</nav>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/tasks.js"></script>
</body></html>
