<!DOCTYPE html>

<html class="dark" lang=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PerchFlow - Process Detail</title>
<meta name="description" content="PerchFlow - Lightweight Windows process & service manager with built-in web UI. Written in Rust."/>
<meta property="og:title" content="PerchFlow - Process & Service Manager"/>
<meta property="og:description" content="Lightweight single-binary process manager for Windows, written in Rust."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://github.com/buyuuz/PerchFlow"/>
<meta property="og:image" content="/assets/logo.png?v=brand2"/>
<link href="/assets/fonts.css" rel="stylesheet"/>
<link href="/assets/tailwind.css" rel="stylesheet"/>
<link href="/assets/branding.css?v=brand4" rel="stylesheet"/>
<link href="/assets/topbar-controls.css?v=top2" rel="stylesheet"/>
<link href="/assets/process-detail.css?v=detail1" rel="stylesheet"/>
<link href="/assets/logo.ico?v=brand2" rel="icon" type="image/x-icon"/>
<link rel="icon" type="image/png" href="/assets/favicon-96x96.png?v=brand2" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=brand2" />
<link rel="shortcut icon" href="/assets/favicon.ico?v=brand2" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PerchFlow" />
<link rel="manifest" href="/assets/site.webmanifest?v=brand2" />
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        /* 允许 flex 子项收缩到内容高度以下(配合一屏布局让日志框内部滚动) */
        .layout-min-h-0 {
            min-height: 0;
        }
    </style>
</head>
<body class="pf-detail-body">
<!-- Abstract Gradient Background for OS Depth -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container/10 blur-[100px]"></div>
</div>
<!-- Process detail: same dark-management visual system, purpose-built for monitoring. -->
<main class="pf-detail-main" id="main">
  <header class="pf-detail-header">
    <div class="pf-detail-header-left">
      <a class="pf-detail-back" href="/processes" aria-label="返回进程管理" data-i18n-title="detail.back" title="返回进程管理">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </a>
      <div class="pf-detail-heading">
        <div class="pf-detail-breadcrumb">
          <a href="/processes" data-i18n="detail.back">进程管理</a>
          <span class="pf-detail-breadcrumb-separator" aria-hidden="true">/</span>
          <span data-i18n="detail.label">进程详情</span>
        </div>
        <div class="pf-detail-title-line">
          <h1 id="proc-name" title="">—</h1>
          <span class="pf-detail-status" id="proc-status-badge" data-status="unknown">
            <span class="pf-detail-status-dot" aria-hidden="true"></span>
            <span id="proc-status">—</span>
          </span>
        </div>
      </div>
    </div>
    <div class="pf-detail-header-actions">
      <!-- Same compact two-language picker used by Process / Tasks pages. -->
      <div class="pf-lang-picker" data-pf-language-picker>
        <select class="pf-top-lang" data-lang-select aria-label="语言 / Language" onchange="setLang(this.value)">
          <option value="zh">CN 中文</option>
          <option value="en">EN English</option>
        </select>
        <button type="button" class="pf-lang-trigger" data-lang-trigger aria-label="Language / 语言"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="pf-language-menu" hidden>
          <span class="pf-lang-code" data-lang-code>CN</span>
          <span class="pf-lang-label" data-lang-current>中文</span>
          <span class="material-symbols-outlined pf-lang-chevron" aria-hidden="true">keyboard_arrow_down</span>
        </button>
        <div class="pf-lang-menu" id="pf-language-menu" data-lang-menu role="listbox" aria-label="Language / 语言" hidden>
          <button type="button" class="pf-lang-option" role="option" data-lang-value="zh" data-lang-code="CN" data-lang-label="中文" aria-selected="true" tabindex="-1"><span class="pf-lang-code">CN</span><span class="pf-lang-option-label">中文</span><span class="material-symbols-outlined pf-lang-check" aria-hidden="true">check</span></button>
          <button type="button" class="pf-lang-option" role="option" data-lang-value="en" data-lang-code="EN" data-lang-label="English" aria-selected="false" tabindex="-1"><span class="pf-lang-code">EN</span><span class="pf-lang-option-label">English</span><span class="material-symbols-outlined pf-lang-check" aria-hidden="true">check</span></button>
        </div>
      </div>
      <div class="pf-detail-action-group" role="group" aria-label="进程操作">
        <button type="button" class="pf-detail-action pf-detail-action--neutral" id="detail-stop"
                onclick="act('stop')" data-i18n-title="button.stop" title="停止">
          <span class="material-symbols-outlined" aria-hidden="true">stop</span><span data-i18n="button.stop">停止</span>
        </button>
        <button type="button" class="pf-detail-action pf-detail-action--outline" id="detail-restart"
                onclick="act('restart')" data-i18n-title="button.restart" title="重启">
          <span class="material-symbols-outlined" aria-hidden="true">refresh</span><span data-i18n="button.restart">重启</span>
        </button>
        <button type="button" class="pf-detail-action pf-detail-action--primary" id="detail-start"
                onclick="act('start')" data-i18n-title="button.start" title="启动">
          <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span><span data-i18n="button.start">启动</span>
        </button>
      </div>
    </div>
  </header>

  <section class="pf-detail-overview" aria-label="进程指标">
    <div class="pf-detail-metrics">
      <div class="pf-metric">
        <div class="pf-metric-label"><span class="material-symbols-outlined" aria-hidden="true">tag</span><span data-i18n="label.pid">PID</span></div>
        <div class="pf-metric-value" id="proc-pid">—</div>
      </div>
      <div class="pf-metric">
        <div class="pf-metric-label"><span class="material-symbols-outlined" aria-hidden="true">speed</span><span data-i18n="label.cpu_usage">CPU 使用率</span></div>
        <div class="pf-metric-value pf-metric-accent" id="proc-cpu">—</div>
      </div>
      <div class="pf-metric">
        <div class="pf-metric-label"><span class="material-symbols-outlined" aria-hidden="true">memory</span><span data-i18n="label.memory">内存占用</span></div>
        <div class="pf-metric-value" id="proc-mem">—</div>
      </div>
      <div class="pf-metric">
        <div class="pf-metric-label"><span class="material-symbols-outlined" aria-hidden="true">schedule</span><span data-i18n="label.uptime">运行时间</span></div>
        <div class="pf-metric-value" id="proc-uptime">—</div>
      </div>
    </div>
    <div class="pf-detail-command-row">
      <div class="pf-detail-command-label">
        <span class="material-symbols-outlined" aria-hidden="true">terminal</span>
        <span data-i18n="label.command_start">启动命令</span>
      </div>
      <div class="pf-detail-command-box">
        <span class="pf-detail-dollar" aria-hidden="true">$</span>
        <code id="proc-cmd">—</code>
        <button class="pf-detail-copy" type="button" onclick="copyProcessCommand()"
                id="detail-copy" data-i18n-title="detail.copy_command" title="复制命令" aria-label="复制命令">
          <span class="material-symbols-outlined" aria-hidden="true">content_copy</span>
        </button>
      </div>
    </div>
  </section>

  <section class="pf-detail-logs">
    <header class="pf-log-toolbar">
      <div class="pf-log-heading">
        <div class="pf-log-title-line">
          <span class="pf-log-title-icon material-symbols-outlined" aria-hidden="true">terminal</span>
          <h2 data-i18n="log.output">日志输出</h2>
          <span class="pf-log-counter" id="log-line-count" aria-live="off">0 行</span>
        </div>
        <p data-i18n="detail.log_subtitle">查看进程输出与运行记录</p>
      </div>
      <div class="pf-log-tools">
        <button class="pf-log-clear" type="button" onclick="clearLogs()"
                data-i18n-title="log.clear" title="清屏">
          <span class="material-symbols-outlined" aria-hidden="true">delete_sweep</span>
          <span data-i18n="log.clear">清屏</span>
        </button>
        <div class="pf-log-lines-wrapper">
          <select id="lines-select" onchange="loadRecentLogs()" aria-label="日志行数">
            <option data-i18n="log.lines_100" value="100">100 行</option>
            <option data-i18n="log.lines_500" selected value="500">500 行</option>
            <option data-i18n="log.lines_1000" value="1000">1000 行</option>
          </select>
          <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
        </div>
        <button class="pf-live-toggle is-on" type="button" id="live-toggle" onclick="toggleLive()"
                role="switch" aria-checked="true" data-i18n-title="detail.switch_live" title="切换实时日志">
          <span data-i18n="log.live">实时</span>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>
      </div>
    </header>

    <div class="pf-terminal-window">
      <div class="pf-terminal-chrome">
        <span class="pf-terminal-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pf-terminal-chrome-title">stdout <span class="pf-terminal-chrome-sep">/</span> <span id="log-process-name">process</span></span>
        <span class="pf-terminal-chrome-right">UTF-8</span>
      </div>
      <div class="pf-terminal-content terminal-scroll" id="log-content" data-empty="等待日志输出…"
           role="log" aria-label="进程日志" aria-live="off" tabindex="0"></div>
      <div class="pf-terminal-footer">
        <span class="material-symbols-outlined" aria-hidden="true">subdirectory_arrow_right</span>
        <span data-i18n="detail.log_footer">标准输出 · 仅当前进程</span>
        <span class="pf-terminal-footer-spacer"></span>
        <span class="pf-terminal-footer-indicator" id="log-view-mode" data-i18n="detail.live_status">实时模式</span>
      </div>
    </div>
  </section>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/topbar-controls.js?v=top2"></script>
<script src="/assets/process-detail.js"></script>
</body></html>
