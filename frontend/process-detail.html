<!DOCTYPE html>

<html class="dark" lang=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PerchFlow - Process Detail</title>
<meta name="description" content="PerchFlow - Lightweight Windows process & service manager with built-in web UI. Written in Rust."/>
<meta property="og:title" content="PerchFlow - Process & Service Manager"/>
<meta property="og:description" content="Lightweight single-binary process manager for Windows, written in Rust."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://github.com/buyuuz/PerchFlow"/>
<meta property="og:image" content="/assets/logo.png?v=brand2"/>
<link href="/assets/fonts.css" rel="stylesheet"/>
<link href="/assets/tailwind.css" rel="stylesheet"/>
<link href="/assets/logo.ico?v=brand2" rel="icon" type="image/x-icon"/>
<link rel="icon" type="image/png" href="/assets/favicon-96x96.png?v=brand2" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=brand2" />
<link rel="shortcut icon" href="/assets/favicon.ico?v=brand2" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PerchFlow" />
<link rel="manifest" href="/assets/site.webmanifest?v=brand2" />
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        /* 允许 flex 子项收缩到内容高度以下(配合一屏布局让日志框内部滚动) */
        .layout-min-h-0 {
            min-height: 0;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen overflow-hidden flex flex-col font-body-md antialiased selection:bg-primary-container/30 selection:text-primary">
<!-- Abstract Gradient Background for OS Depth -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container/10 blur-[100px]"></div>
</div>
<!-- Main Content Canvas (No Nav Shell due to Task-Focused Detail View) -->
<main class="relative z-10 flex-grow layout-min-h-0 flex flex-col p-4 md:p-container-padding max-w-7xl mx-auto w-full gap-gutter">
<!-- Header Section -->
<header class="flex flex-col md:flex-row md:items-center justify-between gap-gutter pb-gutter border-b border-white/5">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 shrink-0 rounded-full hover:bg-white/10 transition-colors text-on-surface-variant hover:text-primary group" onclick="window.location.href='/processes'">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
</button>
<div class="flex items-center gap-3">
<h1 class="font-headline-lg text-headline-lg text-on-surface" id="proc-name">-</h1>
<!-- Technical Badge -->
<div class="flex items-center gap-1.5 px-2 py-0.5 rounded-sm bg-primary-container/10 border border-primary/20">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="font-mono-label text-mono-label text-primary" id="proc-status">-</span>
</div>
</div>
</div>
<div class="flex flex-wrap items-center gap-2">
<!-- Language Selector -->
<select class="bg-surface-container-high border border-white/10 rounded px-3 h-9 text-on-surface-variant font-body-md text-body-md cursor-pointer" onchange="setLang(this.value)" data-lang-select>
<option value="zh">🇨🇳 中文</option>
<option value="en">🇬🇧 English</option>
<option value="es">🇪🇸 Español</option>
<option value="ja">🇯🇵 日本語</option>
<option value="pt">🇧🇷 Português</option>
</select>
<button class="flex-1 md:flex-none flex items-center justify-center gap-1 sm:gap-2 px-2 sm:px-4 h-9 rounded-DEFAULT border border-outline-variant text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-colors font-body-sm whitespace-nowrap" onclick="act('stop')">
<span class="material-symbols-outlined text-[18px]">stop</span>
                    <span data-i18n="button.stop">停止</span>
                </button>
<button class="flex-1 md:flex-none flex items-center justify-center gap-1 sm:gap-2 px-2 sm:px-4 h-9 rounded-DEFAULT border border-primary/30 text-primary hover:bg-primary/10 transition-colors font-body-sm whitespace-nowrap" onclick="act('restart')">
<span class="material-symbols-outlined text-[18px]">restart_alt</span>
                    <span data-i18n="button.restart">重启</span>
                </button>
<button class="flex-1 md:flex-none flex items-center justify-center gap-1 sm:gap-2 px-2 sm:px-4 h-9 rounded-DEFAULT bg-primary text-on-primary hover:bg-primary-fixed transition-colors font-body-sm whitespace-nowrap shadow-[0_0_15px_rgba(68,216,241,0.2)]" onclick="act('start')">
<span class="material-symbols-outlined text-[18px]">play_arrow</span>
                    <span data-i18n="button.start">启动</span>
                </button>
</div>
</header>
<!-- Upper Section: Frosted Info Panel -->
<section class="bg-white/[0.06] backdrop-blur-[30px] rounded-lg border-t border-l border-white/10 border-b border-r border-transparent shadow-sm p-4 md:p-container-padding transition-all duration-300 hover:bg-white/[0.08]">
<div class="grid grid-cols-2 md:grid-cols-4 gap-y-gutter gap-x-card-gap">
<!-- Data Items -->
<div class="flex flex-col gap-1">
<span class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.pid">PID</span>
<span class="font-mono-data text-mono-data text-on-surface" id="proc-pid">-</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.cpu_usage">CPU 使用率</span>
<span class="font-mono-data text-mono-data text-primary" id="proc-cpu">-</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.memory">内存占用</span>
<span class="font-mono-data text-mono-data text-on-surface" id="proc-mem">-</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.uptime">运行时间</span>
<span class="font-mono-data text-mono-data text-on-surface" id="proc-uptime">-</span>
</div>
<div class="flex flex-col gap-1 col-span-2 md:col-span-4">
<span class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.command_start">启动命令</span>
<div class="bg-black/20 px-3 py-1.5 rounded-DEFAULT border border-white/5 overflow-x-auto terminal-scroll">
<span class="font-mono-data text-mono-data text-on-surface whitespace-nowrap" id="proc-cmd">-</span>
</div>
</div>
</div>
</section>
<!-- Lower Section: Log Viewer -->
<section class="flex flex-col flex-grow layout-min-h-0 mt-2">
<!-- Log Controls -->
<div class="flex items-center justify-between mb-card-gap">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">terminal</span>
                    <span data-i18n="log.output">日志输出</span>
                </h2>
<div class="flex items-center gap-gutter">
<!-- Clear Button -->
<button class="flex items-center justify-center gap-1 px-3 h-8 rounded-DEFAULT border border-outline-variant text-on-surface-variant hover:bg-white/5 hover:text-on-surface transition-colors font-body-sm whitespace-nowrap" onclick="clearLogs()" data-i18n-title="log.clear" title="清屏">
<span class="material-symbols-outlined text-[18px]">cleaning_services</span>
                    <span data-i18n="log.clear">清屏</span>
                </button>
<!-- Lines Selector -->
<select class="bg-surface-container border border-outline-variant text-on-surface-variant font-body-sm text-body-sm rounded-DEFAULT px-3 py-1 focus:ring-1 focus:ring-primary focus:border-primary outline-none" id="lines-select" onchange="loadRecentLogs()">
<option data-i18n="log.lines_100" value="100">100 行</option>
<option data-i18n="log.lines_500" selected="" value="500">500 行</option>
<option data-i18n="log.lines_1000" value="1000">1000 行</option>
</select>
<!-- Glass Toggle -->
<div class="flex items-center gap-2 cursor-pointer group" id="live-toggle" onclick="toggleLive()">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors" data-i18n="log.live">实时</span>
<div class="toggle-track w-8 h-4 bg-primary/20 rounded-full p-[2px] transition-colors border border-white/10 backdrop-blur-md relative flex items-center">
<div class="toggle-thumb w-3 h-3 bg-primary rounded-full transform transition-transform shadow-sm"></div>
</div>
</div>
</div>
</div>
<!-- Terminal Area -->
<div class="bg-[#000000]/40 backdrop-blur-md rounded-lg border border-white/[0.08] flex-grow flex flex-col overflow-hidden relative shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)]">
<!-- Terminal Header bar (optional subtle indication) -->
<div class="h-6 bg-white/[0.02] border-b border-white/[0.05] flex items-center px-4 gap-2">
<div class="w-2 h-2 rounded-full bg-error/50"></div>
<div class="w-2 h-2 rounded-full bg-tertiary-container/50"></div>
<div class="w-2 h-2 rounded-full bg-primary/50"></div>
</div>
<!-- Log Content -->
<div class="p-4 md:p-gutter overflow-y-auto overflow-x-auto whitespace-pre-wrap break-words terminal-scroll flex-grow layout-min-h-0 font-mono-data text-[10px] sm:text-mono-data space-y-1" id="log-content"></div>
</div>
</section>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/process-detail.js"></script>
</body></html>
