<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Perch Login</title>
<link href="/assets/fonts.css" rel="stylesheet"/>
<link href="/assets/tailwind.css" rel="stylesheet"/>
<link href="/assets/logo.ico" rel="icon" type="image/x-icon"/>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #dde3e5;
        }
        .glass-input:focus {
            border-color: #44d8f1;
            outline: none;
            box-shadow: 0 0 0 1px rgba(68, 216, 241, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Gradient Setup -->
<div class="absolute inset-0 z-0 opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-surface-container-highest blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-sm px-6">
<div class="glass-card rounded-xl p-8 flex flex-col items-center shadow-lg transition-all duration-300 hover:bg-[rgba(255,255,255,0.08)]">
<!-- Brand -->
<div class="flex flex-col items-center mb-8">
<img alt="Perch" class="w-12 h-12 rounded-full border border-primary/30 mb-4 object-cover bg-primary/10" src="/assets/logo.png"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Perch</h1>
</div>
<!-- Form -->
<form class="w-full" onsubmit="doLogin(event)">
<div class="mb-6">
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-2 text-center" for="token">请输入 perch.toml 中配置的访问令牌</label>
<div class="relative">
<input class="glass-input w-full rounded-lg px-4 py-3 font-mono-data text-mono-data transition-all" id="token" name="token" placeholder="Enter Token..." required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</button>
</div>
<p class="mt-2 text-center font-body-sm text-body-sm text-error hidden" id="err"></p>
</div>
<button class="w-full bg-primary text-on-primary font-mono-label text-mono-label py-3 rounded-lg hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(68,216,241,0.3)]" type="submit">
                    进入
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer / Version -->
<div class="mt-8 text-center">
<span class="font-mono-data text-mono-data text-on-surface-variant/50">v2.4.0-stable</span>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
        function togglePassword() {
            const tokenInput = document.getElementById('token');
            const visibilityIcon = document.getElementById('visibility-icon');

            if (tokenInput.type === 'password') {
                tokenInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                tokenInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }

        async function doLogin(e) {
            e.preventDefault();
            const t = document.getElementById('token').value;
            const errEl = document.getElementById('err');
            errEl.classList.add('hidden');
            setToken(t);
            const resp = await fetch('/api/processes', { headers: { 'Authorization': 'Bearer ' + t } });
            if (resp.ok) {
                window.location.href = '/processes';
            } else {
                errEl.textContent = '令牌无效';
                errEl.classList.remove('hidden');
            }
        }
    </script>
</body></html>
