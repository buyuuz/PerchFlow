<!DOCTYPE html>

<html class="dark" lang=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PerchFlow - Process & Service Manager</title>
<meta name="description" content="PerchFlow - Lightweight Windows process & service manager with built-in web UI. Written in Rust."/>
<meta property="og:title" content="PerchFlow - Process & Service Manager"/>
<meta property="og:description" content="Lightweight single-binary process manager for Windows, written in Rust."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://github.com/buyuuz/PerchFlow"/>
<meta property="og:image" content="/assets/logo.png?v=brand2"/>
<link href="/assets/fonts.css" rel="stylesheet"/>
<link href="/assets/tailwind.css" rel="stylesheet"/>
<link href="/assets/logo.ico?v=brand2" rel="icon" type="image/x-icon"/>
<link rel="icon" type="image/png" href="/assets/favicon-96x96.png?v=brand2" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=brand2" />
<link rel="shortcut icon" href="/assets/favicon.ico?v=brand2" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PerchFlow" />
<link rel="manifest" href="/assets/site.webmanifest?v=brand2" />
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #dde3e5;
        }
        .glass-input:focus {
            border-color: #44d8f1;
            outline: none;
            box-shadow: 0 0 0 1px rgba(68, 216, 241, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Gradient Setup -->
<div class="absolute inset-0 z-0 opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-surface-container-highest blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-sm px-6">
<div class="glass-card rounded-xl p-8 flex flex-col items-center shadow-lg transition-all duration-300 hover:bg-[rgba(255,255,255,0.08)]">
<!-- Brand -->
<div class="flex flex-col items-center mb-8">
<img alt="PerchFlow" class="w-20 h-20 mb-4 object-contain" src="/assets/logo.png?v=brand2"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Perch<span class="text-primary">Flow</span></h1>
</div>
<!-- Form -->
<form class="w-full" onsubmit="doLogin(event)">
<div class="mb-6">
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-2 text-center" data-i18n="login.token_label" for="token">请输入 perch.toml 中配置的访问令牌</label>
<div class="relative">
<input class="glass-input w-full rounded-lg px-4 py-3 font-mono-data text-mono-data transition-all" id="token" name="token" placeholder="Enter Token..." required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
</button>
</div>
<p class="mt-2 text-center font-body-sm text-body-sm text-error hidden" id="err"></p>
</div>
<button class="w-full bg-primary text-on-primary font-mono-label text-mono-label py-3 rounded-lg hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(68,216,241,0.3)]" type="submit">
                    <span data-i18n="button.enter">进入</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer / Version -->
<div class="mt-8 text-center flex flex-col items-center gap-3">
<select class="bg-surface-container-high border border-white/10 rounded px-3 h-9 text-on-surface-variant font-body-md text-body-md cursor-pointer" onchange="setLang(this.value)" data-lang-select>
<option value="zh">🇨🇳 中文</option>
<option value="en">🇬🇧 English</option>
<option value="es">🇪🇸 Español</option>
<option value="ja">🇯🇵 日本語</option>
<option value="pt">🇧🇷 Português</option>
</select>
<span class="font-mono-data text-mono-data text-on-surface-variant/50">v{{VERSION}}</span>
</div>
</main>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script>
        function togglePassword() {
            const tokenInput = document.getElementById('token');
            const visibilityIcon = document.getElementById('visibility-icon');

            if (tokenInput.type === 'password') {
                tokenInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                tokenInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }

        async function doLogin(e) {
            e.preventDefault();
            const tokenVal = document.getElementById('token').value;
            const errEl = document.getElementById('err');
            errEl.classList.add('hidden');
            setToken(tokenVal);
            const resp = await fetch('/api/processes', { headers: { 'Authorization': 'Bearer ' + tokenVal } });
            if (resp.ok) {
                window.location.href = '/processes';
            } else {
                errEl.textContent = t('error.token_invalid');
                errEl.classList.remove('hidden');
            }
        }

        (async function autoRedirectIfLoggedIn() {
            const saved = getToken();
            if (!saved) return;
            try {
                const resp = await fetch('/api/processes', { headers: { 'Authorization': 'Bearer ' + saved } });
                if (resp.ok) window.location.replace('/processes');
            } catch (_) { /* network error: stay on login page */ }
        })();
    </script>
</body></html>
