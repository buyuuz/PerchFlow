<!DOCTYPE html>

<html class="dark" lang=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PerchFlow - Processes</title>
<meta name="description" content="PerchFlow - Lightweight Windows process & service manager with built-in web UI. Written in Rust."/>
<meta property="og:title" content="PerchFlow - Process & Service Manager"/>

<meta property="og:type" content="website"/>

<link href="/assets/tailwind.css" rel="stylesheet"/>
<link href="/assets/branding.css?v=brand4" rel="stylesheet"/>
<link href="/assets/process-table.css?v=table1" rel="stylesheet"/>
<link href="/assets/topbar-controls.css?v=top2" rel="stylesheet"/>
<link href="/assets/logo.ico?v=brand2" rel="icon" type="image/x-icon"/>
<link rel="icon" type="image/png" href="/assets/favicon-96x96.png?v=brand2" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=brand2" />
<link rel="shortcut icon" href="/assets/favicon.ico?v=brand2" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=brand2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PerchFlow" />
<link rel="manifest" href="/assets/site.webmanifest?v=brand2" />
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        /* Custom scrollbar for modern feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2); 
        }
    </style>
<link rel="stylesheet" href="/assets/pf-dialog.css">
</head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary-container/30">
<!-- TopNavBar (Adapted from Shared Components) -->
<nav class="pf-process-topnav fixed top-0 w-full z-50 h-14 bg-surface/60 backdrop-blur-[30px] border-b border-white/10 shadow-sm flex justify-between items-center px-4 md:px-container-padding">
<!-- Left: Logo & Nav Links -->
<div class="flex items-center gap-8 h-full">
<div class="pf-header-brand text-primary">
<img alt="PerchFlow" class="pf-brand-icon" src="/assets/logo.png?v=brand2" width="28" height="28"/>
<span class="pf-brand-name">Perch<span class="text-on-surface">Flow</span></span>
            </div>
<div class="hidden md:flex h-full gap-6">
<!-- Active Nav Item (Dashboard/Processes) -->
<a class="pf-main-nav-link" data-i18n="nav.processes" href="/processes" aria-current="page">
                    进程
                </a>
<!-- Inactive Nav Item (Tasks) -->
<a class="pf-main-nav-link" data-i18n="nav.tasks" href="/tasks">
                    定时任务
                </a>
<a class="pf-main-nav-link" data-i18n="nav.projects" href="/projects">项目</a>
<a class="pf-main-nav-link" href="/docker">Docker</a>
</div>
</div>
<!-- Right: Actions & Status -->
<div class="pf-process-nav-right pf-top-actions">
<!-- Connection Status -->
<div class="pf-top-status" role="status" aria-label="Connected">
<span class="pf-top-status-dot" aria-hidden="true"></span>
<span>Connected</span>
</div>
<!-- Primary Action -->
<button class="pf-process-add pf-top-add" type="button" onclick="openAddModal()">
<span class="pf-top-add-icon" aria-hidden="true"></span>
                <span class="pf-top-add-text" data-i18n="button.add_process">添加进程</span>
            </button>
<!-- Language Selector -->
<div class="pf-lang-picker" data-pf-language-picker>
  <!-- Keep native select as keyboard/JS-off fallback and existing i18n event target. -->
  <select class="pf-top-lang" data-lang-select aria-label="语言 / Language" onchange="setLang(this.value)">
    <option value="zh">CN 中文</option>
    <option value="en">EN English</option>
  </select>
  <button type="button" class="pf-lang-trigger" data-lang-trigger aria-label="Language / 语言" aria-haspopup="listbox" aria-expanded="false" aria-controls="pf-language-menu" hidden>
    <span class="pf-lang-code" data-lang-code>CN</span>
    <span class="pf-lang-label" data-lang-current>中文</span>
    <span class="material-symbols-outlined pf-lang-chevron" aria-hidden="true">keyboard_arrow_down</span>
  </button>
  <div class="pf-lang-menu" id="pf-language-menu" data-lang-menu role="listbox" aria-label="Language / 语言" hidden>
    <button type="button" class="pf-lang-option" role="option" data-lang-value="zh" data-lang-code="CN" data-lang-label="中文" aria-selected="true" tabindex="-1"><span class="pf-lang-code">CN</span><span class="pf-lang-option-label">中文</span><span class="material-symbols-outlined pf-lang-check" aria-hidden="true">check</span></button>
    <button type="button" class="pf-lang-option" role="option" data-lang-value="en" data-lang-code="EN" data-lang-label="English" aria-selected="false" tabindex="-1"><span class="pf-lang-code">EN</span><span class="pf-lang-option-label">English</span><span class="material-symbols-outlined pf-lang-check" aria-hidden="true">check</span></button>
  </div>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="pt-[80px] px-4 md:px-container-padding pb-20 md:pb-10 max-w-[1600px] mx-auto">
<!-- Header Section -->
<div class="flex justify-between items-center mb-6">
<div>
<h1 class="pf-process-page-title text-on-surface" data-i18n="page.processes_title">进程管理</h1>
<p class="pf-process-page-subtitle text-on-surface-variant" data-i18n="page.processes_subtitle">监控和管理系统进程</p>
</div>
<!-- Filter/Search (Conceptual) -->
<div class="flex gap-2">
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input id="proc-search" class="bg-surface-container-high border border-white/10 rounded pl-9 pr-3 py-1.5 text-sm font-body-sm focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 text-on-surface placeholder:text-on-surface-variant/50 w-32 md:w-64 transition-all" data-i18n-placeholder="search.processes" placeholder="搜索进程..." type="search" autocomplete="off" aria-label="搜索进程"/>
</div>
</div>
</div>
<!-- Process management table: one process per horizontal row -->
<section class="pf-process-table-shell" aria-label="进程列表">
  <div class="pf-process-table-scroll" tabindex="0" aria-label="可横向滚动的进程列表">
    <table class="pf-process-table" aria-label="进程管理列表">
      <colgroup>
        <col style="width:3.5%">
        <col style="width:17%">
        <col style="width:8%">
        <col style="width:6.5%">
        <col style="width:6.4%">
        <col style="width:7%">
        <col style="width:8.4%">
        <col style="width:8%">
        <col style="width:16.3%">
        <col style="width:18.9%">
      </colgroup>
      <thead>
        <tr>
          <th scope="col"><input type="checkbox" id="proc-select-all" aria-label="选择所有显示的进程"/></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="name"><span data-table-label="name">进程名称</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="status"><span data-table-label="status">状态</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="pid"><span data-table-label="pid">PID</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="cpu"><span data-table-label="cpu">CPU</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="mem"><span data-table-label="mem">MEM</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="uptime"><span data-table-label="uptime">UPTIME</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" aria-sort="none"><button type="button" class="pf-sort-button" data-sort-key="restarts"><span data-table-label="restarts">RESTARTS</span><span class="material-symbols-outlined pf-sort-icon" aria-hidden="true">unfold_more</span></button></th>
          <th scope="col" data-table-label="cmd">启动命令</th>
          <th scope="col" data-table-label="actions">操作</th>
        </tr>
      </thead>
      <tbody id="proc-table-body"></tbody>
    </table>
  </div>
</section>
<div id="proc-selection-toolbar" class="pf-selection-toolbar" hidden>
  <span id="proc-selected-label" role="status"></span>
  <button type="button" id="proc-clear-selection" class="pf-clear-selection">取消选择</button>
</div>
<p id="proc-scroll-hint" class="pf-table-scroll-hint">左右滑动表格可查看更多列和操作</p>
<!-- Mobile Bottom Spacer -->
<div style="height: 80px;" class="block md:hidden w-full shrink-0"></div>
</main>
<!-- Add Process Modal -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden items-center justify-center p-4" id="add-modal">
<div class="glass-card w-full max-w-md rounded-xl p-6 flex flex-col gap-4">
<h2 class="font-headline-md text-headline-md text-on-surface" id="add-modal-title" data-i18n="modal.add_process">添加进程</h2>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.name_en" for="add-name">进程名称（英文）</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="add-name" type="text" autocomplete="off" data-i18n-placeholder="placeholder.process_name" placeholder="MailHub"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="add-alias-zh" data-i18n="label.alias_zh">中文别名（可选）</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-body-md text-body-md text-on-surface" id="add-alias-zh" type="text" maxlength="80" autocomplete="off" placeholder="邮箱管理中心" data-i18n-placeholder="placeholder.process_alias"/>
<p class="pf-process-alias-hint" data-i18n="label.alias_zh_hint">只用于展示，不改变进程启动、停止和日志对应的英文名称。</p>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.command">命令</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="add-cmd" placeholder="/usr/bin/node" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.args">参数 (空格分隔)</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface" id="add-args" placeholder="server.js --port 8080" type="text"/>
</div>
<div class="flex flex-col gap-1.5 pf-cwd-field">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="add-cwd" data-i18n="label.cwd">工作目录（可选）</label>
<input class="bg-black/20 border border-white/10 rounded px-3 py-2 font-mono-data text-mono-data text-on-surface pf-cwd-input" id="add-cwd" type="text" spellcheck="false" autocomplete="off" placeholder="D:\Projects\MyApp" data-i18n-placeholder="placeholder.cwd" aria-describedby="cwd-help cwd-validation"/>
<p class="pf-process-alias-hint" id="cwd-help" data-i18n="label.cwd_hint">相对路径以此目录为基准，留空则沿用默认启动规则。</p>
<div class="pf-cwd-suggestion" id="cwd-suggestion" hidden>
  <span class="material-symbols-outlined" aria-hidden="true">folder_open</span>
  <code id="cwd-suggest-value"></code>
  <button type="button" id="cwd-use-suggestion" onclick="applySuggestedCwd()" data-i18n="button.use_cwd_suggestion">使用建议</button>
</div>
<p class="pf-cwd-validation" id="cwd-validation" role="status" aria-live="polite" hidden></p>
</div>
<div class="flex items-center gap-2">
<input id="add-autostart" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" data-i18n="label.autostart" for="add-autostart">开机自启</label>
</div>
<p class="font-body-sm text-body-sm text-error hidden" id="add-err"></p>
<div class="flex justify-end gap-3">
<button class="px-4 py-2 rounded font-body-md text-body-md border border-primary text-primary hover:bg-primary/10" data-i18n="button.cancel" onclick="closeAddModal()">取消</button>
<button class="px-6 py-2 rounded font-body-md text-body-md bg-primary text-on-primary hover:bg-primary-fixed" data-i18n="button.save" onclick="submitAddModal()">保存</button>
</div>
</div>
</div>
<!-- Mobile Bottom Nav -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex items-center bg-surface/60 backdrop-blur-xl border-t border-white/10 h-14 box-content pb-[env(safe-area-inset-bottom)] md:hidden">
<a class="flex-1 flex flex-col items-center justify-center text-primary gap-0.5 py-1" href="/processes">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">monitoring</span>
<span class="text-[10px]" data-i18n="nav.processes_short">进程</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center text-on-surface-variant opacity-70 gap-0.5 py-1" href="/tasks">
<span class="material-symbols-outlined text-[20px]">assignment_turned_in</span>
<span class="text-[10px]" data-i18n="nav.tasks_short">任务</span>
</a>
<a class="flex-1 flex flex-col items-center justify-center text-on-surface-variant opacity-70 gap-0.5 py-1" href="/projects"><span class="material-symbols-outlined text-[20px]">folder</span><span class="text-[10px]" data-i18n="nav.projects_short">项目</span></a>
<a class="flex-1 flex flex-col items-center justify-center text-on-surface-variant opacity-70 gap-0.5 py-1" href="/docker"><span class="material-symbols-outlined text-[20px]">deployed_code</span><span class="text-[10px]">Docker</span></a>
</nav>
<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/pf-dialog.js"></script>
<script src="/assets/topbar-controls.js?v=top2"></script>
<script src="/assets/process-cwd.js?v=cwd1"></script>
<script src="/assets/processes.js?v=cwd1"></script>
</body></html>
