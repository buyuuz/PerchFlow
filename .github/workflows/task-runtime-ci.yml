name: Task runtime reliability CI
on:
  push:
    branches:
      - feature/task-runtime-reliability
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/task-runtime-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: JavaScript syntax and argument tests
        run: |
          node --check frontend/assets/tasks.js
          node dev/test_task_args.js
