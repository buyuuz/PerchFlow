name: Build PerchFlow Windows x64 portable (main)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-portable-release.yml
      - dev/portable/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout actual main source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust and frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          foreach ($js in @('frontend/assets/projects.js','frontend/assets/tasks.js','frontend/assets/task-detail.js','frontend/assets/pf-dialog.js','frontend/assets/processes.js')) {
            node --check $js
            if ($LASTEXITCODE -ne 0) { throw "JS syntax validation failed: $js" }
          }

      - name: Fresh Windows x64 release compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 build failed' }
          if (-not (Test-Path target/x86_64-pc-windows-msvc/release/perch.exe)) { throw 'Missing newly built perch.exe' }

      - name: Verify blue P is embedded in Windows EXE
        shell: pwsh
        run: |
          ./dev/verify_exe_brand_icon.ps1 -ExePath target/x86_64-pc-windows-msvc/release/perch.exe

      - name: Package production portable release (no test demo)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-Windows-x64'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/perch.exe (Join-Path $root 'PerchFlow.exe')
          foreach ($name in @('Portable-Init.ps1','PerchFlow-Start.vbs','PerchFlow-Stop.vbs','PerchFlow-Stop-Helper.ps1','README.md')) {
            Copy-Item -LiteralPath (Join-Path 'dev/portable' $name) -Destination $root
          }
          $info = @(
            'PerchFlow Windows x64 Portable - MAIN'
            ('Source commit: ' + $env:GITHUB_SHA)
            ('Built UTC: ' + [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
            'Build: cargo build --release --target x86_64-pc-windows-msvc'
            'This package does not contain a config, token, sample project, or demo task.'
          )
          [IO.File]::WriteAllLines((Join-Path $root 'BUILD_INFO.txt'), $info, [Text.UTF8Encoding]::new($false))
          if (-not (Test-Path (Join-Path $root 'PerchFlow.exe'))) { throw 'Missing renamed PerchFlow.exe in portable output' }
          if (Test-Path (Join-Path $root 'perch.exe')) { throw 'Legacy perch.exe must not be included' }
          if (Test-Path (Join-Path $root 'perch.toml')) { throw 'Refusing to distribute private config' }
          if (Test-Path (Join-Path $root 'demo')) { throw 'Refusing to distribute old Test demos' }
          if (@(Get-ChildItem -Path $root -Recurse | Where-Object { $_.Name -match '(?i)test|mock|demo' }).Count -gt 0) {
            throw 'Unexpected test/demo file in production package'
          }

      - name: Real Windows isolated production-package smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-Windows-x64'
          $smoke = Join-Path $env:RUNNER_TEMP 'perchflow-main-release-smoke'
          Copy-Item -LiteralPath $source -Destination $smoke -Recurse
          $exe = Join-Path $smoke 'PerchFlow.exe'
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'Portable-Init.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'Production first run init failed' }
            $config = Join-Path $smoke 'perch.toml'
            $raw = Get-Content -LiteralPath $config -Raw
            $port = [regex]::Match($raw,'(?m)^bind\s*=\s*"127\.0\.0\.1:(\d+)"').Groups[1].Value
            $token = [regex]::Match($raw,'(?m)^token\s*=\s*"([^"]+)"').Groups[1].Value
            if (-not $port -or $token.Length -ne 64 -or $token -match 'change-me') { throw 'Unsafe first-start config' }
            $t1 = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'Portable-Init.ps1')
            $t2 = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash
            if ($t1 -ne $t2) { throw 'Initializer rewrote existing user config' }
            & cscript.exe //nologo (Join-Path $smoke 'PerchFlow-Start.vbs') /startonly
            if ($LASTEXITCODE -ne 0) { throw 'Production VBS launcher failed' }
            $dockerPage = Invoke-WebRequest -Uri ('http://127.0.0.1:' + $port + '/docker') -UseBasicParsing -TimeoutSec 5
            if ($dockerPage.StatusCode -ne 200) { throw 'Docker page unavailable in renamed executable' }
            $web = Invoke-WebRequest -Uri ('http://127.0.0.1:' + $port + '/processes') -UseBasicParsing -TimeoutSec 5
            if ($web.StatusCode -ne 200) { throw 'PerchFlow UI failed to serve' }
            $headers = @{Authorization='Bearer ' + $token}
            $tasks = Invoke-RestMethod -Uri ('http://127.0.0.1:' + $port + '/api/tasks') -Headers $headers -TimeoutSec 5
            $projects = Invoke-RestMethod -Uri ('http://127.0.0.1:' + $port + '/api/projects') -Headers $headers -TimeoutSec 5
            if (@($tasks.tasks).Count -ne 0 -or @($projects.projects).Count -ne 0) {
              throw 'New production configuration must not contain demo projects or scripts'
            }
            Write-Host ('RENAMED_MAIN_PORTABLE_SMOKE_OK port=' + $port + ' source=' + $env:GITHUB_SHA)
          } finally {
            $owned = @(Get-CimInstance Win32_Process -Filter "Name='PerchFlow.exe'" | Where-Object { $_.ExecutablePath -ieq $exe })
            if ($owned.Count -gt 0) {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'PerchFlow-Stop-Helper.ps1') -CheckOnly
              if ($LASTEXITCODE -ne 0) { throw 'Stop helper refused empty instance' }
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'PerchFlow-Stop-Helper.ps1')
              if ($LASTEXITCODE -ne 0) { throw 'Stop helper failed to stop isolated manager' }
            }
          }

      - name: Create final distribution ZIP and integrity file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-Windows-x64'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-Windows-x64-main.zip'
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal -Force
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($zip + '.sha256.txt', $sha + '  PerchFlow-Windows-x64-main.zip' + [Environment]::NewLine)
          Write-Host ('RELEASE_ZIP_SHA256=' + $sha)

      - name: Upload brand-new main portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: perchflow-windows-x64-main-portable
          path: |
            dist/PerchFlow-Windows-x64-main.zip
            dist/PerchFlow-Windows-x64-main.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30