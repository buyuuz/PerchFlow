name: Build isolated Windows local test ZIP

on:
  push:
    branches:
      - feature/project-hub-local-test
      - feature/project-hub-live-runs
      - feature/project-hub-pf001-pf004
      - feature/project-hub-optional-cron
      - feature/project-hub-ui-consistency-pf005-pf009
      - feature/project-hub-pf010-pf011
      - feature/project-hub-pf012-pf017
      - feature/project-hub-safe-log-naming
      - feature/project-hub-pf018-pf021
      - feature/project-hub-pf022-pf025
      - feature/project-hub-pf026-pf032
      - feature/project-hub-pf033-pf041
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-local-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release candidate code
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Validate release candidate and launch scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          node --check frontend/assets/projects.js
          if ($LASTEXITCODE -ne 0) { throw 'projects JS syntax check failed' }
          node --check frontend/assets/tasks.js
          node --check frontend/assets/task-detail.js
          node --check frontend/assets/pf-dialog.js
          node --check frontend/assets/processes.js
          python -m py_compile dev/local-test/demo/mock_worker.py
          python -m py_compile dev/verify_project_hub_multi_python.py
      - name: Edge mocked UI viewport + interaction regression (PF-005..PF-041)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install playwright
          python dev/verify_project_hub_ui_consistency.py
          python dev/verify_project_hub_pf012_pf017.py
          python dev/verify_project_hub_pf018_pf021.py
          python dev/verify_project_hub_pf026_pf032.py
          if ($LASTEXITCODE -ne 0) { throw 'Edge PF026-PF032 regression failed' }
          python dev/verify_project_hub_pf033_pf041.py
          if ($LASTEXITCODE -ne 0) { throw 'Edge PF033-PF041 regression failed' }
      - name: Compile 64-bit Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release
          if (-not (Test-Path target/release/perch.exe)) { throw 'Missing built perch.exe' }
      - name: Real EXE with two FAKE Python scripts and 3-log retention
        run: python dev/verify_project_hub_multi_python.py --exe target/release/perch.exe --report dev/reports/pf001-pf004-runtime.json
      - name: Verify Cron disable and repeated concurrent start/delete on real EXE
        shell: pwsh
        run: |
          python dev/verify_project_hub_cron_race.py --exe target/release/perch.exe --report dev/reports/cron-race-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'isolated Cron/race verification failed' }
      - name: Upload Cron/race verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perchflow-cron-race-report
          path: dev/reports/cron-race-verification.json
          if-no-files-found: warn
          retention-days: 30
      - name: Assemble clean portable folder
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-PF033-PF041-Test-Win64'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item -LiteralPath 'target/release/perch.exe' -Destination $folder
          Copy-Item -LiteralPath 'dev/local-test/Start-Test.ps1' -Destination $folder
          Copy-Item -LiteralPath 'dev/local-test/Stop-Test.ps1' -Destination $folder
          Copy-Item -LiteralPath 'dev/local-test/Start-Test.cmd' -Destination $folder
          Copy-Item -LiteralPath 'dev/local-test/Stop-Test.cmd' -Destination $folder
          Copy-Item -LiteralPath 'dev/local-test/README-LOCAL-TEST.md' -Destination $folder
          Copy-Item -LiteralPath 'dev/local-test/demo' -Destination $folder -Recurse
          if (Test-Path (Join-Path $folder 'perch.toml')) {
            throw 'Refusing to distribute an existing config or token'
          }
      - name: Smoke-test local launcher and disabled demo in temporary directory
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-PF033-PF041-Test-Win64'
          $smoke = Join-Path $env:RUNNER_TEMP 'perch-rc-localtest-smoke'
          Copy-Item -LiteralPath $source -Destination $smoke -Recurse
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'Start-Test.ps1') -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw 'Start-Test.ps1 failed on Windows PowerShell 5.1' }
            $config = Get-Content -LiteralPath (Join-Path $smoke 'perch.toml') -Raw
            $port = [regex]::Match($config,'(?m)^bind\s*=\s*"127\.0\.0\.1:(\d+)"\s*$').Groups[1].Value
            $token = [regex]::Match($config,'(?m)^token\s*=\s*"([^"]+)"\s*$').Groups[1].Value
            if (-not $port -or -not $token) { throw 'Generated TOML missing local bind or token' }
            $base = 'http://127.0.0.1:' + $port
            $headers = @{ Authorization = 'Bearer ' + $token }
            $tasks = Invoke-RestMethod -Uri ($base + '/api/tasks') -Headers $headers
            $demo = @($tasks.tasks | Where-Object { $_.name -eq 'rc_mock_python' })
            if ($demo.Count -ne 1 -or $demo[0].enabled -ne $false -or $demo[0].schedule -ne '') {
              throw 'Demo Python task must be manual-only without a Cron plan'
            }
            $scheduledBefore = Invoke-RestMethod -Uri ($base + '/api/tasks?scope=scheduled') -Headers $headers
            if (@($scheduledBefore.tasks).Count -ne 0) {
              throw 'Manual-only demo was incorrectly listed as a scheduled task'
            }
            $projects = Invoke-RestMethod -Uri ($base + '/api/projects') -Headers $headers
            if (@($projects.projects | Where-Object { $_.name -eq 'RC Sandbox Demo' }).Count -ne 1) {
              throw 'Missing preconfigured safe demo project'
            }
            if (Test-Path (Join-Path $smoke 'demo/results.txt')) {
              throw 'Demo ran without authorization'
            }
            $started = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python/run') -Method POST -Headers $headers
            if ($started.ok -ne $true) { throw 'Explicit demo run failed to start' }
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            $status = $null
            do {
              Start-Sleep -Milliseconds 250
              $status = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python') -Headers $headers
            } while ($status.status -eq 'running' -and [DateTime]::UtcNow -lt $deadline)
            if ($status.status -ne 'success') { throw ('Mock Python task did not succeed: ' + $status.status) }
            if (-not (Test-Path (Join-Path $smoke 'demo/results.txt'))) { throw 'Missing mock results.txt' }
            if (-not (Test-Path (Join-Path $smoke 'demo/output/report.csv'))) { throw 'Missing mock report.csv' }
            $history = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python/history') -Headers $headers
            if (@($history.runs).Count -lt 1 -or $history.runs[0].files_recorded -ne $true) {
              throw 'File tracking sidecar was not recorded'
            }
            # Test Cron changes on the synthetic Python script only.
            $scheduleJson = @{ schedule='0 0 0 * * *'; enabled=$false } | ConvertTo-Json
            $linked = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python/schedule') -Method PUT -Headers $headers -ContentType 'application/json' -Body $scheduleJson
            if (-not $linked.ok -or $linked.enabled) { throw 'Cannot create paused Cron plan' }
            $scheduledAfter = Invoke-RestMethod -Uri ($base + '/api/tasks?scope=scheduled') -Headers $headers
            if (@($scheduledAfter.tasks | Where-Object { $_.name -eq 'rc_mock_python' }).Count -ne 1) { throw 'Planned demo missing in schedule list' }
            $removed = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python/schedule') -Method DELETE -Headers $headers
            if (-not $removed.ok) { throw 'Cannot remove Cron plan' }
            $scheduledLast = Invoke-RestMethod -Uri ($base + '/api/tasks?scope=scheduled') -Headers $headers
            if (@($scheduledLast.tasks).Count -ne 0) { throw 'Removed Cron still appears in schedule list' }
            $original = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python') -Headers $headers
            if ($original.schedule -ne '' -or $original.enabled) { throw 'Cron removal changed manual-only state' }
            $afterHistory = Invoke-RestMethod -Uri ($base + '/api/tasks/rc_mock_python/history') -Headers $headers
            if (@($afterHistory.runs).Count -lt 1 -or $afterHistory.runs[0].run_id -ne $started.run_id) {
              throw 'Cron removal discarded script history'
            }
            Write-Host 'PASS isolated local package: manual-only demo, logs, add/remove Cron, history preserved'
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'Stop-Test.ps1')
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Smoke-test stop script exited nonzero' }
          }
      - name: Verify real-time Python log is visible BEFORE child exit
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-PF033-PF041-Test-Win64'
          $smoke = Join-Path $env:RUNNER_TEMP 'perch-rc-live-output-smoke'
          Copy-Item -LiteralPath $source -Destination $smoke -Recurse
          try {
            $worker = Join-Path $smoke 'demo/slow_worker.py'
            @('import time','print("LIVE_UNBUFFERED_LINE")','time.sleep(9)') | Set-Content -LiteralPath $worker -Encoding UTF8
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'Start-Test.ps1') -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw 'Cannot launch test server' }
            $config = Get-Content -LiteralPath (Join-Path $smoke 'perch.toml') -Raw
            $port = [regex]::Match($config,'(?m)^bind\s*=\s*"127\.0\.0\.1:(\d+)"\s*$').Groups[1].Value
            $token = [regex]::Match($config,'(?m)^token\s*=\s*"([^"]+)"\s*$').Groups[1].Value
            $base = 'http://127.0.0.1:' + $port
            $headers = @{ Authorization = 'Bearer ' + $token }
            $py = & python -c 'import sys;print(sys.executable)'
            $body = @{
              name='test_live_python'
              cmd=([string]$py).Trim()
              args=@($worker)
              cwd=(Join-Path $smoke 'demo')
              schedule='0 0 0 * * *'
              timeout_secs=20
              enabled=$false
            } | ConvertTo-Json
            $created = Invoke-RestMethod -Uri ($base + '/api/tasks') -Method POST -Headers $headers -ContentType 'application/json' -Body $body
            if (-not $created.ok) { throw 'Cannot add test task' }
            $started = Invoke-RestMethod -Uri ($base + '/api/tasks/test_live_python/run') -Method POST -Headers $headers
            if (-not $started.ok) { throw 'Cannot start test task' }
            $rid = $started.run_id
            $observed = $false
            $deadline = [DateTime]::UtcNow.AddSeconds(6)
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 300
              $task = Invoke-RestMethod -Uri ($base + '/api/tasks/test_live_python') -Headers $headers
              if ($task.status -eq 'running') {
                try {
                  $log = Invoke-RestMethod -Uri ($base + '/api/tasks/test_live_python/log/' + $rid) -Headers $headers
                  if ($log.content -match 'LIVE_UNBUFFERED_LINE') { $observed=$true; break }
                } catch {}
              } else { break }
            }
            if (-not $observed) { throw 'Unbuffered Python output missing while task running' }
            Write-Host 'PASS: Live stdout is visible BEFORE process completion'
            $stop = Invoke-RestMethod -Uri ($base + '/api/tasks/test_live_python/stop') -Method POST -Headers $headers
            if (-not $stop.ok) { throw 'Unable to cancel isolated test task' }
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'Stop-Test.ps1')
          }
      - name: Zip portable test folder and publish SHA-256
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-PF033-PF041-Test-Win64.zip'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'dist/PerchFlow-PF033-PF041-Test-Win64'
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $line = $hash + '  PerchFlow-PF033-PF041-Test-Win64.zip'
          [IO.File]::WriteAllText(($zip + '.sha256.txt'), $line + [Environment]::NewLine)
          Write-Host ('Release candidate ZIP SHA256: ' + $hash)
      - name: Upload test ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: perchflow-pf033-pf041-windows-ui-test
          path: |
            dist/PerchFlow-PF033-PF041-Test-Win64.zip
            dist/PerchFlow-PF033-PF041-Test-Win64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
