[package]
name = "perch"
version = "0.1.0"
edition = "2021"
description = "Lightweight single-binary process and service manager for Windows, with a built-in web UI. A native, no-runtime alternative to NSSM, WinSW, PM2 and Supervisor."
repository = "https://github.com/tanzibiao/perch"
homepage = "https://github.com/tanzibiao/perch"
readme = "README.md"
# license 待定(README 目前标注 TBD)。选定后填入 SPDX 标识,如 license = "MIT"
keywords = ["process-manager", "windows-service", "supervisor", "service-manager", "daemon"]
categories = ["command-line-utilities", "os::windows-apis", "web-programming::http-server"]

[lib]
name = "perch"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rust-embed = "8"
mime_guess = "2"
sysinfo = "0.30"
cron = "0.12"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
futures = "0.3"
async-stream = "0.3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
